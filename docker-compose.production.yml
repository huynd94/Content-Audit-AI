services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/reviews').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: content_audit_ai
      POSTGRES_USER: content_audit_ai
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_audit_ai -d content_audit_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres-production-data:/var/lib/postgresql/data

volumes:
  postgres-production-data:
